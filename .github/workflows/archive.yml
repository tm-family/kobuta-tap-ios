name: Archive

# Archive → IPA Export まで通ることを手動で確認する（アップロードはしない）。
# main への push では Build だけを実行するため、push では起動しない。
# develop / release/** は upload.yml が Archive を含む。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: ./.github/workflows/_archive.yml
    with:
      upload: false
    secrets: inherit
