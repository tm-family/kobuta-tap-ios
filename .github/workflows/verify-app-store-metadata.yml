name: Verify/App Store metadata

# App Store の説明文などは、文字数の上限を超えていると App Store Connect への反映時に弾かれる。
# 反映（Metadata/App Store）の前に、PR の時点で欠損と文字数超過を機械的に落とす。
# App 情報（カテゴリ・年齢制限など、AppStore/app_info.json）も、書き方と年齢制限の質問の漏れを確かめる。
# Game Center のリーダーボード（AppStore/game_center.json）も、書き方と言語の漏れを確かめる。
# アプリ内課金（AppStore/in_app_purchases.json）も、書き方・文字数・言語の漏れを確かめる。
# 傘のきせかえの絵（Tools/generate_umbrella_skins.py が書き出すもの）が、元の絵と柄の定義から書き出し直されているかも確かめる。
# あわせて、スクリーンショットの撮影設定（枚数の上限、撮影モードの Scene との突き合わせなど）も読めるか確かめる。
# JSON を読むだけなので macOS ランナーもビルドも必要ない。

on:
  pull_request:
    paths:
      - 'AppStore/**'
      - 'Tools/**'
      - 'Configs/Project.xcconfig'
      - 'KobutaTap/KobutaAssets.xcassets/**'
      - '**/Screenshot/ScreenshotDemo.swift'
      - '.github/workflows/verify-app-store-metadata.yml'

permissions:
  contents: read

jobs:
  verify:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify App Store metadata
        run: python3 Tools/upload_metadata.py --check

      - name: Verify app info
        run: python3 Tools/upload_app_info.py --check

      - name: Verify Game Center config
        run: python3 Tools/upload_game_center.py --check

      - name: Verify in-app purchases config
        run: python3 Tools/upload_in_app_purchases.py --check

      - name: Verify umbrella skins are up to date
        run: python3 Tools/generate_umbrella_skins.py --check

      - name: Verify screenshot config
        run: |
          set -euo pipefail
          python3 Tools/app_store_config.py bundle-id
          python3 Tools/app_store_config.py scenes
          python3 Tools/app_store_config.py display-types
