name: In-App Purchases/App Store

# アプリ内課金を App Store Connect に作り、AppStore/in_app_purchases.json とそろえる。手動実行のみ。
#
#   Tools/upload_in_app_purchases.py … 課金・言語ごとの表示名と説明・価格・配信地域を作る・書き換える
#
# JSON から消した課金・言語は消さない（商品 ID は消しても使い直せないため、消すのは人が画面で行う）。
# 審査用のスクリーンショット・審査メモと、審査への提出（最初の課金はアプリのバージョンと一緒に出す）は、ここでは行わない。
# API キーに課金を編集できる役割（Admin か App Manager）が無いか、「有料 App」の契約が有効でないと 403 で止まる。
# dry_run にすると、読み取りの API だけ使い、何をするかを出す。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '書き込まず、何をするかだけ出す'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  in-app-purchases:
    name: upload
    # App Store Connect にアプリが無いリポジトリ（テンプレート自身など）は ENABLE_DELIVERY=false でスキップする
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify in-app purchases config
        run: python3 Tools/upload_in_app_purchases.py --check

      - name: Create Private Key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=()
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # Bundle ID は Configs/Project.xcconfig から読む（ワークフローに書き写すと二重管理になるため）
          .venv/bin/python -u Tools/upload_in_app_purchases.py ${options[@]+"${options[@]}"} | tee "$RUNNER_TEMP/upload.log"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## アプリ内課金"
            echo
            echo "- 反映: $([ "$DRY_RUN" = "true" ] && echo "しない（dry-run）" || echo "する")"
            echo
            if [ -f "$RUNNER_TEMP/upload.log" ]; then
              echo '```diff'
              cat "$RUNNER_TEMP/upload.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
