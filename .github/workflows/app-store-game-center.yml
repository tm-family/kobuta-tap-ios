name: Game Center/App Store

# Game Center のリーダーボードを App Store Connect に作り、AppStore/game_center.json とそろえる。手動実行のみ。
#
#   Tools/upload_game_center.py … アプリの Game Center を有効にし、リーダーボードと言語ごとの名前・単位を作る・書き換える
#
# JSON から消したリーダーボード・言語は消さない（リーダーボードの ID は消しても使い直せないため、消すのは人が画面で行う）。
# 公開済みのリーダーボードの名前を変えるとき（新しいバージョンが要る）と、審査に出すバージョンへの追加は、App Store Connect の画面で行う。
# API キーに Game Center を編集できる役割（Admin か App Manager）が無いと 403 で止まる。
# dry_run にすると、読み取りの API だけ使い、何をするかを出す。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '書き込まず、何をするかだけ出す'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  game-center:
    name: upload
    # App Store Connect にアプリが無いリポジトリ（テンプレート自身など）は ENABLE_DELIVERY=false でスキップする
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Game Center config
        run: python3 Tools/upload_game_center.py --check

      - name: Create Private Key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=()
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi

          # Bundle ID は Configs/Project.xcconfig から読む（ワークフローに書き写すと二重管理になるため）
          .venv/bin/python -u Tools/upload_game_center.py ${options[@]+"${options[@]}"} | tee "$RUNNER_TEMP/upload.log"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## Game Center"
            echo
            echo "- 反映: $([ "$DRY_RUN" = "true" ] && echo "しない（dry-run）" || echo "する")"
            echo
            if [ -f "$RUNNER_TEMP/upload.log" ]; then
              echo '```diff'
              cat "$RUNNER_TEMP/upload.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
